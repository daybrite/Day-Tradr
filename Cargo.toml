[package]
name = "day-tradr"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
# Generates typed resource constants (`res::images::…`, `res::assets::…`, `res::fonts::…`) from the
# files under `resource/` on every build — see build.rs and src/lib.rs (§18.5).
build = "build.rs"

[features]
# The default `mock` backend lets bare `cargo build` / rust-analyzer compile out of the box;
# `day build` always passes `--no-default-features --features <backend>`, stripping it.
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
mdc = ["day/mdc"]
xaml = ["day/xaml"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests the iOS staticlib / Android cdylib
# explicitly via `cargo rustc --crate-type` (a desktop cdylib blows past the windows-gnu PE
# export cap).
[lib]
# A CONSTANT name, not the package's. Every artifact Day stages is named after the LIB target —
# `libdayapp.a` for the iOS/macOS staticlib, `libdayapp.so` for the Android cdylib, and the
# `dayapp::` path `src/main.rs` imports — so none of them move when the package is renamed.
# Renaming this app is a one-line edit to `[package] name` above (DESIGN.md §17.5).
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
day = { git = "https://github.com/daybrite/day.git" }
# Watchlist persistence (docs/prefs.md) and the Yahoo Finance quote fetches over the platform
# HTTP stack (docs/http.md) — system proxies and TLS come from the OS; ureq+rustls only on
# Linux/OHOS.
day-part-prefs = { git = "https://github.com/daybrite/day.git" }
day-piece-settings = { git = "https://github.com/daybrite/day.git" }
day-part-http = { git = "https://github.com/daybrite/day.git" }
# Every chart on every page: the price chart and its overlays, the volume strip, the analysis
# panel, the sparklines, the performance comparison and the range tracks are compositions of the
# grammar this crate draws on the canvas. Bare URL, no ref, like the day crates above.
day-piece-charts = { git = "https://github.com/daybrite/day-piece-charts.git" }
# The quote endpoint answers JSON (Yahoo retired the CSV download in 2024 — see src/quotes.rs),
# so the data layer needs a parser. Same crate Day-Skies uses for its forecast API.
serde_json = "1"

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }


[workspace]
