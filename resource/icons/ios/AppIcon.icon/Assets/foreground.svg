<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12352E"/>
      <stop offset="1" stop-color="#0A211C"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BE3B0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7BE3B0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Day icon master (docs/icons.md): full-bleed square backdrop, platforms mask it. -->
  
  <g id="day:foreground">
    <!-- The watchlist sparkline, risen and at rest — the area glow fades like a chart fill. -->
    <path d="M 170 536 C 240 586 280 621 340 614 C 400 606 450 496 520 456 C 570 428 610 506 668 496 C 740 481 800 376 846 312 L 846 756 L 170 756 Z"
          fill="url(#fade)"/>
    <path d="M 170 536 C 240 586 280 621 340 614 C 400 606 450 496 520 456 C 570 428 610 506 668 496 C 740 481 800 376 846 312"
          fill="none" stroke="#7BE3B0" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="846" cy="312" r="42" fill="#EAFBF2"/>
  </g>
  <!-- Single-color silhouette for themed/tinted icons (Android 13, Icon Composer Tinted):
       solid paint only, VectorDrawable subset. Hidden so plain viewers show the icon as
       shipped; the pipeline re-enables it. -->
  
</svg>
