name: tradr-prefs-window
description: The Preferences window (docs/windows.md, desktop combos; TRADR_MOCK=1) — the
  auto Settings… menu action opens the settings page as a singleton window.
flow:
  - wait_for: { id: watchlist-title }
  - menu: { key: day-preferences }
  - wait_for: { id: language-picker }
  - assert_visible: { id: about-version }
  - screenshot: { name: prefs-window, window: day.preferences }
  - close_window: { window: day.preferences }
