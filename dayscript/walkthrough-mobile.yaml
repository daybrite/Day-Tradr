# Day Tradr walkthrough, phone shell (https://daybrite.dev/docs/dayscript).
#
#     day launch -p ios-uikit --env TRADR_MOCK=1 --script dayscript/walkthrough-mobile.yaml
#
# WHY A SECOND SCRIPT: the app builds one of two shells from `day::size_class()` (src/lib.rs),
# and the two do not share a route namespace. The sidebar owns a symbol at the top level
# (`MSFT`); the phone pushes it onto the owning tab's stack, so its route nests under the tab
# (reported as `MSFT/watchlist`). `assert_route` is an exact match, so one script cannot state
# both. Pinning
# the class with `size_class:` does not help on a device: the platform re-reports its real class
# on the next trait pass and the shell flips back mid-run.
#
# Prices come from the deterministic mock, so every literal below is exact on every target.
name: day-tradr-walkthrough-mobile
description: The three-tab phone shell — watchlist, per-tab stacks, symbol management, settings.
flow:
  - wait_for: { id: nav }
  - wait_for: { id: watchlist-title }
  - assert_route: { route: watchlist }
  - assert_text: { id: data-source, key: data_mock }
  - assert_text: { id: wl-price-AAPL, text: "230.04" }
  - assert_text: { id: wl-chg-AAPL, text: "−0.45 (0.20%)" }
  - assert_text: { id: "wl-price-GC=F", text: "3203.55" }
  - assert_text: { id: breadth-up, text: "2" }
  - assert_text: { id: breadth-down, text: "4" }
  - screenshot: m-watchlist

  # The chip-mode control re-reads every chip at once; a full lap leaves the persisted setting
  # where it started, so a rerun sees the same screenshots.
  - tap: { id: chip-mode }
  - assert_text: { id: wl-chg-AAPL, text: "−0.20%" }
  - tap: { id: chip-mode }
  - assert_text: { id: wl-chg-AAPL, text: "−0.45" }
  - tap: { id: chip-mode }
  - assert_text: { id: wl-chg-AAPL, text: "−0.45 (0.20%)" }

  # A row opens the symbol INSIDE the Watchlist tab's own stack, so the route NESTS with the tab
  # key rather than replacing it. This is the difference from the sidebar shell.
  #
  # Note the ORDER: day composes the route from its surfaces in registration order, and a nested
  # surface registers before the one that contains it, so the stack's segment comes FIRST. That
  # is the reverse of the order `navigate:` expects for an absolute path, so a route read back
  # from the app cannot be fed to `navigate:` while both shells nest (day/crates/day-core, nav).
  - tap: { id: wl-row-MSFT }
  - wait_for: { id: detail-price }
  - assert_route: { route: MSFT/watchlist }
  - assert_text: { id: detail-price, text: "514.52" }
  - assert_text: { id: detail-name, text: "Microsoft Corp." }
  - assert_visible: { id: overlay-legend }
  - screenshot: m-detail
  # Back returns to this tab's own root.
  - nav_back: {}
  - wait_for: { id: watchlist-title }
  - assert_route: { route: watchlist }

  # The Symbols tab: its own stack, with the editable list as the root.
  - navigate: { route: manage }
  - wait_for: { id: sym-field }
  - assert_route: { route: manage }
  - input: { id: sym-field, text: "si=f" }
  - tap: { id: sym-add }
  - assert_text: { id: sym-status, key: manage_status_added }
  - screenshot: m-symbols
  # A row here pushes onto the SYMBOLS stack, so the nesting is under that tab instead. Tapped
  # on a row that is already realized: the just-added SI=F sits past the viewport in the
  # recycling list, and an unrealized row has no element for a tap to find (docs/list.md).
  - tap: { id: sym-row-AAPL }
  - wait_for: { id: detail-price }
  - assert_route: { route: AAPL/manage }
  - assert_text: { id: detail-symbol, text: "AAPL" }
  - nav_back: {}
  - wait_for: { id: sym-field }
  # Remove it again so a rerun starts from the same list. Rows realize lazily in the recycling
  # list (docs/list.md), so reach the just-added row through the reorder seam, which addresses
  # rows by index whether or not they are realized.
  - scroll_to: { id: sym-rows }
  - reorder: { id: sym-rows, from: 6, to: 0 }
  - tap: { id: "sym-remove-SI=F" }
  - assert_text: { id: sym-status, key: manage_status_removed }
  - reorder: { id: sym-rows, from: 1, to: 0 }
  - reorder: { id: sym-rows, from: 0, to: 1 }

  # Settings tab. The theme picker is NOT asserted — backends without Cap::Appearance hide it.
  - navigate: { route: settings }
  - wait_for: { id: language-picker }
  - assert_route: { route: settings }
  - assert_text: { id: about-version, text: "0.1.0" }
  - assert_visible: { id: about-source }
  - assert_visible: { id: refresh-all }
  - screenshot: m-settings

  # Switching tabs leaves each stack where it was: open a symbol, leave, come back to it.
  - navigate: { route: watchlist }
  - tap: { id: wl-row-AAPL }
  - wait_for: { id: detail-price }
  - assert_route: { route: AAPL/watchlist }
  - navigate: { route: settings }
  - wait_for: { id: language-picker }
  - navigate: { route: watchlist }
  - wait_for: { id: detail-price }
  - assert_route: { route: AAPL/watchlist }
  - assert_text: { id: detail-price, text: "230.04" }
  - nav_back: {}
  - wait_for: { id: watchlist-title }
